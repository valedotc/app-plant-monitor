<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>IoT Plant Monitor</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($any($event))">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">IoT Plant Monitor</ion-title>
    </ion-toolbar>
  </ion-header>

  @if (plants.length === 0) {
    <div id="container">
      <ion-icon name="leaf-outline" class="empty-icon"></ion-icon>
      <strong>No plants configured</strong>
      <p>Tap the + button to add your first plant monitor.</p>
    </div>
  } @else {
    <div class="plants-list">
      @for (plant of plants; track plant.id) {
        <app-plant-status-card [plant]="plant"></app-plant-status-card>
      }
    </div>
  }

  <ion-fab
    id="bottom-right-container"
    horizontal="end"
    vertical="bottom"
    slot="fixed"
  >
    <ion-fab-button routerLink="/add-device">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
